services:

  petriflow-mcp:
    image: netgrif/petriflow-mcp:1.1.2
    environment:
      PETRIFLOW_MODE: LOCAL
    ports:
      - "3000:3000"

  builder:
    image: netgrif/application-builder:2.1.1-local
    ports:
      - "127.0.0.1:4300:8080"
    environment:
      PROCESS_FILES_ENABLED: "true"
      PUID: "${PUID:-}"
      PGID: "${PGID:-}"
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:8080/" ]
      interval: 10s
      timeout: 10s
      retries: 10
    volumes:
      - ./processes:/data/processes:z
    networks:
      - netgrif-platformnet

  frontend:
    image: netgrif/application-engine-frontend:7.0.3
    ports:
      - "4200:80"
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:80" ]
      interval: 10s
      timeout: 10s
      retries: 10
    depends_on:
      engine:
        condition: service_healthy
    networks:
      - netgrif-platformnet

  init:
    # One-off job, safe to run on every start. The engine image runs as uid 10001 and cannot write
    # to folders created by Docker or by you. The engine also needs a JWT key pair: it is generated
    # here on the first start and then kept in nae/engine/certificates (never overwritten).
    image: alpine/openssl:3.5.9
    user: "0:0"
    entrypoint: [ "sh", "-ec" ]
    command:
      - |
        chown -R 10001:10001 /logs /storage || echo 'chown failed, continuing'
        C=/certs
        if [ ! -s "$$C/private.der" ]; then
          echo "Generating JWT key pair in $$C"
          T=$$(mktemp -d "$$C/.tmp.XXXXXX")
          openssl genrsa -out "$$T/keypair.pem" 4096
          openssl rsa -in "$$T/keypair.pem" -pubout -out "$$T/public.crt"
          openssl pkcs8 -topk8 -inform PEM -outform DER -nocrypt -in "$$T/keypair.pem" -out "$$T/private.der"
          rm "$$T/keypair.pem"
          mv "$$T/public.crt" "$$C/public.crt"
          mv "$$T/private.der" "$$C/private.der"
          rmdir "$$T"
        else
          echo "JWT key pair exists, skipping"
        fi
        if [ ! -s "$$C/public.crt" ]; then
          openssl pkey -inform DER -in "$$C/private.der" -pubout -out "$$C/public.crt"
        fi
        chown -R 10001:10001 "$$C"
        chmod 600 "$$C/private.der"
        chmod 644 "$$C/public.crt"
    volumes:
      - ./nae/engine/logs:/logs:z
      - ./nae/engine/storage:/storage:z
      - ./nae/engine/certificates:/certs:z
    restart: "no"
    networks:
      - netgrif-platformnet

  engine:
    image: netgrif/application-engine-with-mcp:7.0.3
    ports:
      - "8080:8080"
    environment:
      netgrif.engine.server.port: 8080
      NETGRIF_ENGINE_DATA_DATABASE_NAME: netgrif_nae_root
      NETGRIF_ENGINE_DATA_MONGODB_URI: mongodb://nae-mongodb
      NETGRIF_ENGINE_DATA_ELASTIC_URL: nae-elasticsearch
      NETGRIF_ENGINE_DATA_REDIS_HOST: nae-redis
      NETGRIF_WORKER_NODE_NAME: NETGRIF Application Engine
      NETGRIF_WORKER_NODE_HOST: nae-root-engine
      NETGRIF_WORKER_NODE_NODE_TYPE: ENGINE_ROOT
      netgrif.engine.data.redis.namespace: netgrif
      netgrif.engine.security.auth.admin-password: password
      netgrif.engine.management.endpoint.health.show-details: always
      netgrif.engine.management.health.mail.enabled: false
      netgrif.engine.dashboard.enabled: "true"
      netgrif.engine.management.health.elasticsearch.enabled: false
      netgrif.otel.sdk.disabled: 'true'
      netgrif.otel.traces.exporter: none
      netgrif.otel.metrics.exporter: none
      netgrif.otel.logs.exporter: none
      netgrif.engine.security.server-patterns: /api/auth/signup,/api/auth/token/verify,/api/auth/reset,/api/auth/recover,/api/public/**,/v3/api-docs/public,/manage/health,/manage/health/liveness,/manage/health/readiness,/mcp/**
      netgrif.engine.actions.imports: org.springframework.data.domain.PageRequest,org.springframework.data.mongodb.core.query.Criteria,org.springframework.data.domain.Page,org.springframework.data.mongodb.core.query.Query,org.springframework.data.domain.Pageable
      netgrif.engine.security.jwt.private-key: file:/opt/netgrif/engine/certificates/private.der
      spring.ai.mcp.server.type: SYNC
      spring.ai.mcp.server.protocol: streamable
      spring.ai.mcp.server.name: nae-mcp
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:8080/manage/health" ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 180s
    volumes:
      - ./nae/engine/logs:/opt/netgrif/engine/log:z
      - ./nae/engine/storage:/opt/netgrif/engine/storage:z
      - ./nae/engine/modules:/opt/netgrif/engine/modules/custom:ro,z
      - ./nae/engine/certificates:/opt/netgrif/engine/certificates:z
    depends_on:
      init:
        condition: service_completed_successfully
      nae-mongodb:
        condition: service_healthy
      nae-elasticsearch:
        condition: service_healthy
      nae-redis:
        condition: service_healthy
    networks:
      - netgrif-platformnet

  nae-mongodb:
    image: mongo:8.0.3
    command: [ "--replSet", "rs0", "--bind_ip_all", "--port", "27017" ]
    hostname: 127.0.0.1
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}) }" | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 30s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "2G"
        reservations:
          cpus: "0.5"
          memory: "512M"
    ports:
      - "27017:27017"
    networks:
      - netgrif-platformnet

  nae-elasticsearch:
    #    image: elasticsearch:9.4.1
    image: elasticsearch:8.19.15
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s" ]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      cluster.name: elasticsearch
      discovery.type: single-node
      http.host: 0.0.0.0
      xpack.security.enabled: false
      transport.host: 0.0.0.0
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1500M
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - netgrif-platformnet

  nae-redis:
    image: redis:8
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - netgrif-platformnet

networks:
  netgrif-platformnet:
    driver: bridge
    name: netgrif-platformnet
