# BYPASS W5 (see workarounds/README.md): the MCP plugin signs in to the admin
# REST API with Basic auth and no realm, so the admin uses the default realm.
# W2 makes app-users the default realm, where the account admin does not exist,
# and every deploy_process then fails with "NAE admin login failed with HTTP 401".
# This proxy sits between the plugin and the admin and adds X-Realm-Id: Admin to
# requests that carry no realm header.
map $http_x_realm_id $nae_realm_id {
    ""      "Admin";
    default $http_x_realm_id;
}

server {
    listen 8888;
    client_max_body_size 200m;

    location / {
        proxy_pass http://nae-admin:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Realm-Id $nae_realm_id;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
    }
}
